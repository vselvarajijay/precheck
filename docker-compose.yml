# Local stack. Ports are published on 127.0.0.1 only (no auth in the MVP).
# Services bind 0.0.0.0 inside their containers. Other services are added by later slices:
# authoring-mcp (11), tools (12), proxy (13), agent (14).

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  image: precheck-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    DB_PATH: /app/data/app.db
    # Interpolated from the shell first, then .env, so `TYPESAFE_API_KEY= docker compose up` works.
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - ./backend:/app/backend
    - ./data:/app/data

services:
  api:
    <<: *backend
    environment:
      DB_PATH: /app/data/app.db
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      AGENT_URL: http://agent:8300
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  authoring-mcp:
    <<: *backend
    # Agents manage rules here (list, translate, test, PROPOSE). No publish tool by design.
    command: ["python", "-m", "precheck.mcp.authoring", "--transport", "http", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  tools:
    <<: *backend
    # Mock business tools (no real side effects) behind MCP; call log at /calls.
    command: ["python", "-m", "precheck.labtools.server", "--port", "8100"]
    entrypoint: []
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  proxy:
    <<: *backend
    # Enforcement MCP proxy: agents connect here; checks every call against live rules.
    command: ["python", "-m", "precheck.enforcement.mcp_proxy", "--port", "8200"]
    entrypoint: []
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      API_URL: http://api:8000
      PROXY_UPSTREAM_URL: http://tools:8100/mcp
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      api:
        condition: service_healthy
      tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  agent:
    <<: *backend
    # Test agent (scripted scenarios + Claude LLM mode); talks only to the proxy.
    command: ["uvicorn", "precheck.labagent.service:app", "--host", "0.0.0.0", "--port", "8300"]
    entrypoint: []
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_URL: http://api:8000
      AGENT_PROXY_URL: http://proxy:8200/mcp
      AGENT_TOOLS_URL: http://tools:8100
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    image: precheck-frontend:dev
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # --- profile: test (unit + integration tests, no network) -------------------
  api-test:
    <<: *backend
    profiles: ["test"]
    network_mode: none
    env_file: []
    environment:
      DB_PATH: /tmp/test.db
      TYPESAFE_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    entrypoint: []
    command: ["pytest"]

  web-test:
    image: precheck-frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    profiles: ["test"]
    network_mode: none
    environment:
      CI: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["pnpm", "test"]

  # --- profile: e2e (Playwright against an isolated stack: fresh DB, Jev replay) -----
  api-e2e:
    <<: *backend
    profiles: ["e2e"]
    environment:
      DB_PATH: /tmp/e2e/app.db
      ENABLE_TEST_RESET: "true"
      AGENT_URL: http://agent-e2e:8300
      # replay by default; `make e2e-live` / `make e2e-record` switch mode and pass the key.
      JEV_MODE: ${E2E_JEV_MODE:-replay}
      JEV_FIXTURE_LOG: ${E2E_FIXTURE_LOG:-}
      TYPESAFE_API_KEY: ${E2E_JEV_KEY:-}
      # Translator LLM: replay recorded Claude responses unless `make e2e-live-llm`.
      LLM_MODE: ${E2E_LLM_MODE:-replay}
      ANTHROPIC_API_KEY: ${E2E_LLM_KEY:-}
    tmpfs:
      - /tmp/e2e:uid=1000,gid=1000
    command: ["uvicorn", "precheck.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  tools-e2e:
    <<: *backend
    profiles: ["e2e"]
    command: ["python", "-m", "precheck.labtools.server", "--port", "8100"]
    entrypoint: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  proxy-e2e:
    <<: *backend
    profiles: ["e2e"]
    command: ["python", "-m", "precheck.enforcement.mcp_proxy", "--port", "8200"]
    entrypoint: []
    environment:
      API_URL: http://api-e2e:8000
      PROXY_UPSTREAM_URL: http://tools-e2e:8100/mcp
      PROXY_REFRESH_S: "2"
      JEV_MODE: ${E2E_JEV_MODE:-replay}
      TYPESAFE_API_KEY: ${E2E_JEV_KEY:-}
      JEV_FIXTURE_LOG: ${E2E_FIXTURE_LOG:-}
    depends_on:
      api-e2e:
        condition: service_healthy
      tools-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  agent-e2e:
    <<: *backend
    profiles: ["e2e"]
    command: ["uvicorn", "precheck.labagent.service:app", "--host", "0.0.0.0", "--port", "8300"]
    entrypoint: []
    environment:
      API_URL: http://api-e2e:8000
      AGENT_PROXY_URL: http://proxy-e2e:8200/mcp
      AGENT_TOOLS_URL: http://tools-e2e:8100
      LLM_MODE: ${E2E_LLM_MODE:-replay}
      ANTHROPIC_API_KEY: ${E2E_LLM_KEY:-}
    depends_on:
      proxy-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  web-e2e:
    image: precheck-frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    profiles: ["e2e"]
    environment:
      API_URL: http://api-e2e:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  e2e:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: e2e
    image: precheck-e2e:dev
    profiles: ["e2e"]
    environment:
      E2E_BASE_URL: http://web-e2e:5173
      E2E_API_URL: http://api-e2e:8000
      E2E_PROXY_URL: http://proxy-e2e:8200
      E2E_TOOLS_URL: http://tools-e2e:8100
    volumes:
      - ./frontend/e2e:/app/e2e
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - ./frontend/test-results:/app/test-results
    depends_on:
      web-e2e:
        condition: service_healthy
      agent-e2e:
        condition: service_healthy
