[project]
name = "precheck-translator"
version = "0.1.0"
description = "Translate plain-language business cases into pre-check rules (Claude)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "precheck-core",
    "anthropic>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `precheck` is a PEP 420 namespace shared by all packages; this one ships one portion.
[tool.hatch.build.targets.wheel]
packages = ["src/precheck"]

[tool.uv.sources]
precheck-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (Jev/Anthropic); run with -m live"]
addopts = "-m 'not live' -ra"
