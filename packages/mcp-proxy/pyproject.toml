[project]
name = "precheck-mcp-proxy"
version = "0.1.0"
description = "Enforcement MCP proxy: checks every tool call against the live pre-check policy"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "precheck-core",
    "mcp>=1.2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `precheck` is a PEP 420 namespace shared by all packages; this one ships one portion.
[tool.hatch.build.targets.wheel]
packages = ["src/precheck"]

[dependency-groups]
# Proxy tests put the lab's mock tools behind the proxy.
test = ["precheck-lab"]

[tool.uv.sources]
precheck-core = { workspace = true }
precheck-lab = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (Jev/Anthropic); run with -m live"]
addopts = "-m 'not live' -ra"
