[project]
name = "precheck-core"
version = "0.1.0"
description = "Pre-check decision engine for AI agents: rule schema, Jev client, evaluation"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "google-re2>=1.1.20251105",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `precheck` is a PEP 420 namespace shared by all packages; this one ships one portion.
[tool.hatch.build.targets.wheel]
packages = ["src/precheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (Jev/Anthropic); run with -m live"]
addopts = "-m 'not live' -ra"
